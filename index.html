function pupilPanel(){const w=S.potentialWeights(g);return '<h3>우리 문하 · '+g.pupils.length+'/'+g.balance.pupil.max+'명</h3><p class="muted">핵심 모집 2·4·6·8·10년 / 특별 모집 15·25년<br>초절정 '+Math.round(w[4]*100)+'% · 전설 '+Math.round(w[5]*100)+'% (능력별)</p>'+g.pupils.map(p=>'<button class="pupilmini" data-action="pupil" data-id="'+p.id+'"><span class="seal mini">'+esc(p.name[0])+'</span><span><b>'+esc(p.name)+(g.chief===p.id?' ★ 수제자':'')+'</b><small>'+S.grade(Math.max(...Object.values(p.stats)))+' · 명성 '+fmt(p.fame)+' · '+S.state(g,p.country).name+'</small><small>논전 '+p.records.friendly.wins+'승 '+p.records.friendly.losses+'패'+(p.branch?' · 지부장':'')+'</small></span></button>').join('')+'<h3>지부 '+g.branches.length+'/'+g.balance.breakthrough.maxBranches+'</h3>'+btn('branch','제자·나라 지정하기','secondary wide')+(g.learning.tickets.some(t=>!t.used)?'<h3>학습 보상</h3>'+btn('tickets','한계돌파 보상권 사용','goldbutton wide'):'');}
function recText(r){return (r.wins+r.losses)+'전 '+r.wins+'승 '+r.losses+'패';}
function recordsPanel(){return '<h3>경기와 7합은 별도 기록</h3>'+[['friendly','일반 논전'],['individual','개인대회'],['team','단체전·리그']].map(([id,n])=>{const r=g.records[id];return '<button class="recordcard" data-action="recordDetail" data-id="'+id+'"><h4>'+n+'</h4><b>'+recText(r)+'</b><small>내부 '+r.roundWins+'승 '+r.roundLosses+'패'+(id==='team'?' · MVP '+r.mvp+'회':' · 최고 '+r.bestStreak+'연승')+'</small></button>';}).join('')+'<p>'+talentText(S.talent(g))+'</p><p>저서 '+g.books.length+'권 · 독자 '+fmt(g.books.reduce((n,b)=>n+b.readers,0))+'명</p>'+btn('codex','엔딩·업적 도감','compact')+btn('export','현재 삶 내보내기','compact')+btn('import','기록 가져오기','compact');}
function readableNote(text){return advanced()?String(text).replace(/(학식|논변|교화|통솔) 한계돌파 \+\d+(?: \([^)]*\)| · 기존 \+\d+ 대체, 순상승 [+-]?[\d.]+)?/g,'$1의 한계를 넘어섰습니다'):text;}
function newsPanel(){const r=g.report;return r?'<h3>'+g.year+'년차 소식</h3>'+r.notes.slice().reverse().map(n=>'<p class="newsline '+(n.type==='patron'?'patron':'')+'">'+esc(readableNote(n.text))+(n.pupil?' '+btn('pupil','제자 보기','compact','data-id="'+n.pupil+'"'):'')+'</p>').join(''):'<p>한 해를 보내면 저술·제자·후원 결과가 기록됩니다.</p>';}
function decision(preserve=false){if(g.pending||g.awaitingReport||g.ended)return;S.prepareYear(g);const rec=S.recommend(g),picked=rec.selected.map(o=>o.id),p=g.policy;show((g.year+1)+'년차 · 올해 결정하기',statLine()+chiefBar()+'<div class="policy"><label>자동 우선순위<select id="priority">'+[['spread','영향력 확보 (기본)'],['safe','승률 우선'],['fame','명성 기대값'],['challenge','박빙 도전']].map(([id,n])=>'<option value="'+id+'" '+(p.priority===id?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>자동선택 조건<select id="threshold">'+[0,30,50,70,90].map(n=>'<option value="'+n+'" '+(p.threshold===n?'selected':'')+'>'+(n?n+'% 이상':'조건 없음')+'</option>').join('')+'</select></label>'+btn('clear','전체 해제','secondary')+'</div>'+(rec.unmet?'<div class="notice">조건에 맞는 상대가 부족합니다. '+rec.missing+'자리 비어 있음. 결정 완료 시 남은 상대 중 승률이 높은 순으로 채웁니다.</div>':'')+'<div class="opponentgrid">'+S.options(g).map(o=>'<article class="opponent '+(picked.includes(o.id)?'chosen':'')+'" style="--school:'+S.colors[o.id]+'" data-card="'+o.id+'" tabindex="0" role="button" aria-pressed="'+picked.includes(o.id)+'"><header>'+chip(o.id)+'<b class="selectword">'+(picked.includes(o.id)?p.manual.includes(o.id)?'직접 선택 ✓':'자동 추천 ✓':'선택하기')+'</b></header><label><select data-stage="'+o.id+'">'+[0,1,2].map(n=>{const r=S.option(g,o.id,n);return '<option value="'+n+'" '+(o.stage===n?'selected':'')+'>'+(n+1)+'단계 · '+range(r.low,r.high)+'</option>';}).join('')+'</select></label><p class="pair">'+pairText(o.pair)+' 중심 · 나 '+ability(o.power)+'</p><strong class="'+(o.chance>=.5?'up':'down')+'">'+(advanced()?'예상 판세':'예상 개인전 승률')+' '+stance(o.chance)+'</strong><p>명성 승리 +'+o.reward+' / 패배 −'+o.loss+'</p><small class="doctrine">'+esc(S.schools.find(s=>s.id===o.id).core)+'</small></article>').join('')+'</div><section class="entries"><h3>출전자격과 참가 신청은 별개입니다</h3>'+S.upcoming(g).map(t=>'<label><input type="checkbox" data-entry="'+t.id+'" '+(g.planning.registrations[t.id]?'checked':'')+' '+(!t.ok?'disabled':'')+'><b>'+t.name+'</b><span>'+t.reason+'</span></label>').join('')+'</section>'+(g.year===29?'<label>전설대전에 함께할 제자<select id="legendPupil">'+g.pupils.map(p=>'<option value="'+p.id+'" '+(g.planning.legendPupil===p.id?'selected':'')+'>'+esc(p.name)+' · '+S.grade(Math.max(...Object.values(p.stats)))+'</option>').join('')+'</select></label>':'')+'<footer class="dialogdock">'+btn('confirm','결정 완료 · 1년 보내기','primary wide')+'<small>승률은 성장 전 예상입니다. 같은 경지에서도 운에 따라 갈립니다.</small></footer>','decision',preserve);persist();}
function chiefDialog(){
 previewChief||=g.chief;const p=g.pupils.find(p=>p.id===previewChief);if(dialogKind==='decision')returnDialog='decision';
 const comparison=p?S.keys.map(k=>{const b=S.bonus(g,p,k),after=Math.min(100,g.stats[k]+b);return '<p><b>'+S.statNames[k]+'</b> '+ability(g.stats[k])+' '+(advanced()?'→ '+ability(after):'+ '+b+' → '+ability(after))+'</p>';}).join(''):'';
 show('수제자 변경 · 보정 미리보기',statLine()+'<p>제자를 눌러 비교하고, 마지막에 선택을 확정하세요. 실제 능력은 변하지 않고 실전 전력만 보완합니다.</p><div class="chiefchoices">'+g.pupils.map(p=>btn('previewChief',esc(p.name),previewChief===p.id?'selected':'','data-id="'+p.id+'"')).join('')+'</div>'+(p?'<h3>'+esc(p.name)+' 선택 시</h3><div class="compare">'+comparison+'</div>'+btn('chooseChief','이 수제자 선택','primary wide'):'<p>아직 입문한 제자가 없습니다.</p>'),'chief',dialogKind==='chief');
}
function currentPotential(p){return S.keys.map(k=>'<span>'+S.statNames[k]+': <b>'+S.grades[S.potGrade(Math.min(100,p.caps[k]+(p.breakthrough?.key===k?p.breakthrough.amount:0)))]+'</b></span>').join('');}
function pending(){const e=g.pending;if(!e)return;
 if(e.type==='candidate'){show(e.title,(e.last?'<div class="notice gold">올해가 마지막 제자 모집입니다. 수락하거나 거절하면 더는 후보가 찾아오지 않습니다.</div>':e.coreLast?'<div class="notice">초반 핵심 모집은 올해가 마지막. 이후 15·25년차 특별 영입만 남습니다.</div>':'')+'<p>현재 능력과 잠재력은 별개입니다. 잠재경지 안의 실제 한계는 성장하면서 드러납니다. 세 명 중 한 명만 선택할 수 있습니다.</p><div class="candidates">'+e.candidates.map(p=>'<article><h3>'+esc(p.name)+'</h3><p>'+esc(p.hint)+'</p><div class="potential">'+currentPotential(p)+'</div><p>현재 '+S.keys.map(k=>S.statNames[k]+' '+ability(p.stats[k])).join(' · ')+'</p>'+btn('admit','이 제자를 받겠습니다','primary','data-id="'+p.id+'"')+'</article>').join('')+'</div>'+btn('declineCandidates','이번 후보 모두 거절','secondary wide'),'pending');return;}
 if(e.type==='breakthrough'){const p=g.pupils.find(p=>p.id===e.pupil);show(e.title,'<div class="breakhero">悟</div><p>'+esc(p.name)+'이 자신의 한계를 넘어설 준비를 마쳤습니다. 무작위 능력 하나의 잠재 한계가 +1~10 상승합니다. 최대 100.</p><p>여러 명이면 같은 해에 모두 처리합니다. 결과는 저장된 추첨으로 결정됩니다.</p>'+btn('break','한계돌파 시작','goldbutton wide'),'pending');return;}
 if(e.type==='scout'){show(e.title,'<p>현재 '+S.state(g,g.host).name+'의 '+chip('player')+' 영향력: '+pct(S.state(g,g.host).shares.player)+'</p><p>초빙 이동 후 '+g.balance.scout.duration+'년 동안 현지 승리와 패배의 영향력 이동이 모두 ×'+g.balance.scout.multiplier+'. 이동 자체의 무료 영향력 보상은 없습니다.</p>'+e.countries.map(id=>'<article class="offer"><b>'+S.state(g,id).name+'나라</b><p>'+chip('player')+' '+pct(S.state(g,id).shares.player)+' · 1위 '+chip(S.rankings(S.state(g,id))[0].id)+'</p>'+btn('scoutMove','초빙 수락·이동','primary','data-id="'+id+'"')+'</article>').join('')+btn('scoutDecline','현재 나라에 머무르기','secondary wide'),'pending');return;}
 if(e.type==='teamFinal'){teamFinal(false);return;}
 if(e.type==='legend'){show(e.title,'<p>공자·맹자·노자·장자·묵자·한비자·손자·손빈과 당신, 제자 한 명의 10인 토너먼트입니다. 스승과 제자는 반대편 대진에서 결승까지 만나지 않습니다.</p><p>서로 다른 시대의 인물이 모이는 학습용 가상 대전입니다.</p><select id="finalPupil">'+g.pupils.map(p=>'<option value="'+p.id+'" '+(e.pupil===p.id?'selected':'')+'>'+esc(p.name)+' · '+S.grade(Math.max(...Object.values(p.stats)))+'</option>').join('')+'</select>'+btn('legendEnter',g.pupils.length?'전설대전 출전':'제자 없음 · 대전 넘어가기','primary wide'),'pending');}
}
function teamFinal(manual){const e=g.pending,f=e.event.final;if(!lineup.length)lineup=S.recommendLineup(g,f.away,f.requirements);const all=S.roster(g);show(e.title,'<p>'+chip('player')+' 대 '+chip(f.away)+' · 세 개인전 중 두 경기 승리. 각 개인전은 7합입니다.</p>'+f.requirements.map((req,i)=>'<article class="lineuprow"><b>'+['선봉','중견','대장'][i]+' — '+pairText(req)+'</b><small>상대 '+range(S.option(g,f.away,f.stage).low,S.option(g,f.away,f.stage).high)+' · 상성과 실전 운 적용</small>'+(manual?'<select data-role="'+i+'">'+all.map(p=>'<option value="'+p.id+'" '+(lineup[i]===p.id?'selected':'')+'>'+esc(p.name)+' · 적합 '+ability(req.reduce((n,k)=>n+p.stats[k],0)/req.length)+' · '+(p.affinities[f.away]>1?'상성 좋음':p.affinities[f.away]<0?'상성 불리':'상성 무난')+'</option>').join('')+'</select>':'<p>자동 추천: '+esc(all.find(p=>p.id===lineup[i])?.name)+'</p>')+'</article>').join('')+'<div class="row">'+btn('teamRecommend','능력에 맞게 자동 추천','secondary')+(manual?btn('teamCompete','이 배치로 결승 출전','primary'):btn('teamManual','직접 배치하기','primary'))+btn('teamAuto','결과만 보기','secondary')+'</div>','pending');}
function matchBody(m){return '<div class="matchscore"><b>'+esc(m.name)+' '+m.roundWins+' : '+m.roundLosses+' '+esc(m.opponentName)+'</b><small>'+esc(m.context)+' · '+esc(S.state(g,m.country)?.name)+'나라</small></div>'+m.rounds.map(r=>'<div class="roundrow"><b>'+r.number+'합</b><span>'+esc(r.name)+'<small>'+pairText(r.keys)+' · '+ability(r.power)+' 대 '+ability(r.opponent)+'</small></span><strong class="'+(r.won?'up':'down')+'">'+(r.won?'승':'패')+'</strong><p>'+r.description+'</p></div>').join('')+'<div class="notice">'+esc(m.name)+' 명성 '+delta(m.fame)+' · '+esc(m.opponentName)+' 명성 '+delta(m.otherFame||0)+'<br>'+Object.entries(m.shareChanges||{}).map(([id,x])=>chip(id)+' '+pct(x.before)+'→'+pct(x.after)+' ('+delta(x.after-x.before)+'%p)').join('<br>')+(m.school===m.opponentSchool?'<br>같은 학파 안의 대결로 영향력 이동은 없습니다.':'')+'<br>상대 점유율이 0%면 승리해도 빼앗을 영향력이 없습니다. 교화·통솔은 보상 배율이 아닙니다.</div>';}
function findMatch(id){return [...g.records.friendly.matches,...g.records.individual.matches,...g.records.teamDuels.matches,...g.events.flatMap(e=>[...e.matches,...(e.playoffs||[])].flatMap(m=>m.rows||[m]))].find(m=>m.id===id);}
let replayTimer=null,replayCurrent=null;
function replay(id){const m=findMatch(id);if(!m?.rounds)return;replayCurrent=m;clearInterval(replayTimer);let i=0;show('7합 승부 다시 보기','<h3>'+esc(m.name)+' 대 '+esc(m.opponentName)+'</h3><div id="replayDots" class="replaydots">'+m.rounds.map(()=>'<span>?</span>').join('')+'</div><p id="replayLine">첫 주장을 준비합니다…</p>'+btn('replaySkip','보기 건너뛰기 · 결과 확인','primary wide'),'replay');if(pref.motion){finishReplay();return;}replayTimer=setInterval(()=>{const r=m.rounds[i];if(!r){finishReplay();return;}if($('replayDots'))$('replayDots').innerHTML=m.rounds.map((x,j)=>'<span class="'+(j<=i?(x.won?'won':'lost'):'')+'">'+(j<=i?(x.won?'승':'패'):'?')+'</span>').join('');if($('replayLine'))$('replayLine').textContent=r.number+'합 · '+r.name+' · '+(r.won?'승리!':'패배');i++;},650);}
function finishReplay(){clearInterval(replayTimer);if(replayCurrent)show('7합 최종 결과',matchBody(replayCurrent));}
function teamBody(m){return '<h3>'+chip(m.home)+' '+m.homeWins+' : '+m.awayWins+' '+chip(m.away)+'</h3><div class="notice gold">MVP '+esc(m.mvp.name)+' · 개인 7합 '+m.mvp.score+'승</div>'+m.rows.map((r,i)=>'<details><summary>'+['선봉','중견','대장'][i]+' '+esc(r.name)+' '+r.roundWins+':'+r.roundLosses+' '+esc(r.opponentName)+'</summary>'+btn('replay','이 7합 다시 보기','compact','data-id="'+r.id+'"')+matchBody(r)+'</details>').join('')+'<p>우리 명성 '+delta(m.fame)+' · 영향력 '+delta(m.shift)+'%p</p>';}
function eventBody(e){return '<h3>'+esc(e.name)+' · '+S.placement(e.placement)+'</h3><p>우승 '+esc(e.championName||label(e.champion))+' · 우리 '+(e.team?'팀':'개인')+' 성적</p>'+[...e.matches,...(e.playoffs||[])].map(m=>e.team?'<details><summary>'+esc(m.context)+' · '+label(m.winner)+' 승리</summary>'+teamBody(m)+'</details>':'<details><summary>'+esc(m.name)+' '+m.roundWins+':'+m.roundLosses+' '+esc(m.opponentName)+'</summary>'+btn('replay','7합 승부 다시 보기','compact','data-id="'+m.id+'"')+matchBody(m)+'</details>').join('')+'<h3>대회가 남긴 영향력 변화</h3>'+(g.history.find(r=>r.year===e.year)?.effects||[]).filter(x=>x.cause.includes(e.name)||x.cause.includes(S.tiers.find(t=>t.id===e.tier)?.name||e.name)).filter(x=>x.to==='player'||x.from==='player').map(x=>'<p>'+S.state(g,x.country).name+' '+chip(x.to)+' +'+x.amount.toFixed(2)+'%p / '+chip(x.from)+' −'+x.amount.toFixed(2)+'%p</p>').join('');}
function pupilInfo(id){const p=S.actor(g,id);if(!p||p.id==='player')return;show(p.name+' · 독립적인 삶','<p>'+S.state(g,p.country).name+'나라 · '+(p.branch?'지부장':p.caps?'본원 제자':'학파 대표')+' · 명성 '+fmt(p.fame)+'</p>'+(p.caps?'<div class="potential">'+currentPotential(p)+'</div>':'')+S.keys.map(k=>'<p><b>'+S.statNames[k]+'</b> '+ability(p.stats[k])+' <small>'+(p.caps?(p.natural[k]>=p.caps[k]?'자연 한계 도달':'잠재력이 남아 성장 중'):'학파 대표의 현재 경지')+'</small> '+(p.breakthrough?.key===k?'<span class="purple">'+(advanced()?'한계돌파':'돌파 +'+p.breakthrough.amount)+'</span>':'')+'</p>').join('')+'<p>일반 '+recText(p.records.friendly)+' · 개인대회 '+recText(p.records.individual)+' · 단체 개인전 '+recText(p.records.teamDuels)+' · MVP '+p.leagueStats.mvp+'회</p><p>저서 '+p.books.length+'권 · 문하 '+p.students+'명</p>'+(p.books.length?'<details><summary>저서 '+p.books.length+'권 · 독자와 전파</summary>'+p.books.map(b=>'<h4>《'+esc(b.title)+'》</h4><p>'+b.year+'년차 집필 · 독자 '+fmt(b.readers)+'명</p>'+Object.entries(b.byCountry).map(([id,n])=>'<p>'+S.state(g,id).name+'나라 · 독자 '+fmt(n)+'명</p>').join('')).join('')+'</details>':'')+(p.branch?'<details><summary>지부 활동</summary><p>'+S.state(g,p.country).name+'나라에서 현지 논전과 저술을 이어갑니다.</p><p>문하 '+fmt(p.students)+'명</p></details>':'')+(p.pupils.length?'<h3>직계 제자</h3>'+p.pupils.map(x=>btn('pupil',esc(x.name)+' · '+S.grade(Math.max(...Object.values(x.stats))),'pupilmini','data-id="'+x.id+'"')).join(''):'')+'<h3>최근 활동 기록</h3>'+p.history.slice(-12).reverse().map(h=>'<p>'+h.year+'년차 · '+esc(readableNote(h.text))+'</p>').join(''));}
function branchDialog(){const ps=g.pupils.filter(p=>Object.values(p.stats).reduce((a,b)=>a+b,0)/4>=50);show('제자 지부 설립·이전','<p>평균 능력 50 이상인 제자 · 최대 '+g.balance.breakthrough.maxBranches+'개. 지부장은 해당 나라에서 논전과 저술을 하며, 본원의 단체전에는 참가하지 않습니다.</p><label>지부장<select id="branchPupil">'+ps.map(p=>'<option value="'+p.id+'">'+esc(p.name)+(p.branch?' · 현재 '+S.state(g,p.branch).name:'')+'</option>').join('')+'</select></label><label>나라<select id="branchCountry">'+g.states.map(s=>'<option value="'+s.id+'">'+s.name+' · 우리 '+pct(s.shares.player)+'</option>').join('')+'</select></label>'+btn('setBranch','지부 지정','primary wide')+'<p>단체전에 필요한 제자 둘은 본원에 남겨두세요.</p>');}
function ticketDialog(){show('학습 보상권','<p>재도전은 기존과 같은 능력의 돌파를 다시 뽑아 교체합니다. 더 작은 깨달음이 나올 수도 있습니다.</p><p>대오각성권은 같은 능력의 기존 돌파를 +8~10으로 교체합니다. 중복해서 더하지 않습니다. 남은 상한이 작으면 최대 100까지만 적용됩니다.</p><label>보상권<select id="ticket">'+g.learning.tickets.filter(t=>!t.used).map(t=>'<option value="'+t.id+'">'+(t.type==='awakening'?'대오각성 +8~10 확정권':'같은 능력 돌파 재도전권')+'</option>').join('')+'</select></label><label>제자<select id="ticketPupil">'+g.pupils.map(p=>'<option value="'+p.id+'">'+esc(p.name)+(p.breakthrough?' · '+S.statNames[p.breakthrough.key]+' 돌파'+(advanced()?'':' +'+p.breakthrough.amount):' · 돌파 전')+'</option>').join('')+'</select></label>'+btn('useTicket','이 제자에게 사용','goldbutton wide'));}
function breakAnimation(e){if(!e)return;const band=e.amount===10?3:e.amount>=7?2:e.amount>=4?1:0,titles=['작은 깨달음','한계를 넘어서다','거대한 깨달음','대오각성'],seconds=pref.motion?0:[1.5,1.8,2.2,3][band];show(e.strong?'대오각성':titles[band],'<div class="breakscene"><div class="breakhero breaklevel'+band+' '+(band===3?'legendglow':'')+'" style="--break-seconds:'+seconds+'s">悟</div><h2 class="purple">'+esc(e.name)+' · '+S.statNames[e.key]+' '+(advanced()?'새로운 경지': '+'+e.amount)+'</h2><p>'+(e.previous?(advanced()?'기존 깨달음을 같은 능력의 새 깨달음으로 교체했습니다.': '기존 돌파 +'+e.previous+' → +'+e.amount+' · 실제 순상승 '+(e.delta>=0?'+':'')+e.delta):'잠재 한계가 확장됐습니다. 현재 능력에도 반영됩니다.')+'</p><small>'+ (seconds?'깨달음의 파동이 번집니다.':'결과가 저장됐습니다.')+'</small></div>'+btn('breakDone',g.pending?'다음 필수 선택':'결과로 돌아가기','primary wide'),'breakresult');}
function quiz(){const fresh=!g.learning.current,q=S.prepareQuestion(g);if(!q){startYear();return;}if(fresh){persist();q.deadline=Date.now()+g.balance.learning.seconds*1000;try{localStorage.setItem(storage+'quiz-clock',JSON.stringify({runId:g.runId,id:q.id,year:q.year,deadline:q.deadline}));}catch{}}show(q.year+'년차 · 백가의 한 문제','<div class="quiztime">남은 시간 <b id="quizSeconds">'+Math.max(0,Math.ceil((q.deadline-Date.now())/1000))+'</b>초</div><h3>'+esc(q.text)+'</h3><div class="quizchoices">'+q.choices.map((s,i)=>btn('answer',esc(s),'secondary','data-index="'+i+'"')).join('')+'</div><p>틀려도 삶은 계속됩니다. 무오답 기록은 종료됩니다.</p>','quiz');clearInterval(quizTimer);quizTimer=setInterval(()=>{const sec=Math.max(0,Math.ceil((q.deadline-Date.now())/1000));if($('quizSeconds'))$('quizSeconds').textContent=sec;if(sec<=0)answer(-1);},100);}
function answer(i){clearInterval(quizTimer);const q=g.learning.current;if(!q)return;const r=S.answerQuestion(g,q.choices[i]??'',Date.now());persist();show(r.correct?'정답!':'다시 기억해보세요','<h3>'+esc(r.answer)+'</h3><p>'+esc(r.explanation)+'</p><p>현재 '+g.learning.answers.filter(a=>a.correct).length+'/'+g.learning.answers.length+'문제 정답 · '+(g.learning.perfect?'27년 무오답 도전 중':'무오답 기록은 종료, 학습은 계속')+'</p>'+btn('quizContinue','올해 진행하기','primary wide'),'quizresult');}
function animationLines(){const r=g.report,a=S.actions.find(a=>a.id===r.action),pool={study:['죽간을 펼쳐 서로 다른 근거를 비교합니다…','학설의 빈틈을 메우는 중…'],train:['반론을 예상하며 주장을 가다듬습니다…','청중 앞에서 변론을 연습합니다…'],teach:['어려운 뜻을 쉬운 비유로 전합니다…','서로 다른 청중의 질문을 듣습니다…'],mentor:['천하의 인재를 알아보는 눈을 기릅니다…','새로운 제자 후보들이 배움터를 살핍니다…'],balanced:['읽고 말하고 설득하며 한 해를 보냅니다…','서로 다른 배움의 연결점을 찾습니다…'],risk:['여러 학파의 원리를 연결합니다…','모순을 풀 새로운 해석을 시험합니다…']};return [...pool[a.id],Object.values(S.doctrines)[g.year%4],r.grade==='대성공'?'대성공! 막혔던 배움이 한꺼번에 열렸습니다.':r.grade==='성장 없음'?'도전은 실패했지만 논전과 문하는 계속됩니다.':'배움이 차곡차곡 쌓였습니다.','한 해의 논전과 문하 기록을 정리합니다…'];}

function teacher(){if(!teacherUnlocked){show('교사 수치 설정','<p>마스터코드는 교실 편의 잠금입니다. 서버 보안이나 조작 방지가 아닙니다.</p><input id="masterKey" type="password" inputmode="numeric" placeholder="마스터코드">'+btn('unlock','설정 열기','primary wide'),'settings');return;}function fields(v,path=[]){return Object.entries(v).map(([k,x])=>{const p=[...path,k],name=settingNames[k]||S.schools.find(s=>s.id===k)?.name||k;return x&&typeof x==='object'&&!Array.isArray(x)?'<details><summary>'+esc(name)+'</summary><div class="settingfields">'+fields(x,p)+'</div></details>':'<label>'+esc(name)+'<input data-setting="'+p.join('.')+'" value="'+esc(Array.isArray(x)?JSON.stringify(x):x)+'"></label>';}).join('');}show('교사 수치 설정 · v1.3','<p>확률 0~1. 배열은 JSON 형식. 기본 잠재력 순서: 삼류·이류·일류·절정·초절정·전설. 통솔 보정은 삼류 확률을 넘길 수 없습니다.</p>'+fields(settings)+'<div class="row">'+btn('saveSettings','새 생애 기본값 저장','primary')+btn('applySettings','현재 생애 다음 해 적용','secondary')+btn('resetSettings','기본값 복원','secondary')+btn('exportHTML','설정 내장 HTML 내려받기','secondary')+'</div><p>조정 규칙 기록은 기본 규칙 기록과 구분합니다. 리그 일정·30년 최종전·학습 보상 시점은 고정입니다.</p>','settings');}
function saveSettings(apply=false){const c=C.copy(settings);try{document.querySelectorAll('[data-setting]').forEach(el=>{const ps=el.dataset.setting.split('.');let o=c;for(const k of ps.slice(0,-1))o=o[k];const k=ps.at(-1);o[k]=Array.isArray(o[k])?JSON.parse(el.value):Number(el.value);});if(!C.validate(c))throw Error();if(apply&&g&&Math.max(g.pupils.length,...S.schools.map(s=>g.masters.filter(m=>m.school===s.id).reduce((n,m)=>n+m.pupils.length,0)))>c.pupil.max){toast('현재 영입된 제자 수보다 최대 인원을 낮출 수 없습니다. 새 생애 기본값으로 저장하세요.');return false;}settings=c;pref.seconds=settings.animationSeconds;persist();return true;}catch{toast('범위·확률 합계·배열 형식을 확인하세요. 저장하지 않았습니다.');return false;}}
function download(name,content,mime){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

 }html=html.replace(/<script id="embeddedSettings">[\s\S]*?<\/script>/g,'');html=html.replace('</head>','<scr'+'ipt id="embeddedSettings">window.BAEKGA_EMBEDDED_SETTINGS='+JSON.stringify(settings).replace(/</g,'\\u003c')+';</scr'+'ipt></head>');download('제자백가_사상과_문하의_30년_v1.3.html',html,'text/html');}catch{toast('독립 HTML을 불러오지 못했습니다. 제공된 파일을 사용해주세요.');}}
async function importLife(file){if(!file||file.size>30e6){toast('30MB 이하 기록 파일만 지원합니다.');return;}try{const o=JSON.parse(await file.text()),life=o.life|| (o.lifeGraph?Store.unpack(o.lifeGraph):null);if(o.format!=='baekga-v13'||!S.valid(life))throw Error();g=S.rehydrate(life);view='home';persist();base();close();}catch{toast('유효한 v1.3 기록이 아닙니다. v1.2는 보존본에서 이어갈 수 있습니다.');}}
function guide(){show('사상과 문하의 30년 · v1.3','<h3>네 능력, 분명한 선택</h3><p>학식: 지식과 근거 / 논변: 논리 반박 / 교화: 청중 설득 / 통솔: 공동 논전 조율과 우수 후보 유입. 교화는 추가 보상 배율이 아닙니다.</p><p>통솔 수련 1회마다 새 후보의 초절정 확률 +1%p, 삼류 −1%p. 기본 최대10회. 전설 1%는 고정입니다. 제자는 통솔 수련 없이도 20년 안에 잠재 한계까지 자동 성장합니다.</p><h3>7합과 기록</h3><p>일반·개인전은 한 사람과 7합. 단체전은 세 사람이 각각 7합, 팀은 2승하면 승리합니다. 경기 승패와 내부 승패는 별도 저장하며, 보상은 경기당 한 번입니다.</p><h3>한 세계에서 주고받기</h3><p>NPC도 논전·저술·대회·교육·모집·이동·지부 활동을 합니다. 나라 영향력 합계는100%. 상대 영향력이0이면 명성만 얻습니다. 이동이나 관직에서 무료 영향력이 생기지 않습니다.</p><h3>학습형</h3><p>3년마다10초 문제, 27년까지9문제.3·6연속 정답에 돌파 재도전,9연속에 대오각성권. 틀려도 계속 플레이합니다.</p><h3>정보 경지</h3><p>입문0~29 / 숙련30~49 / 삼류50~59 / 이류60~69 / 일류70~79 / 절정80~89 / 초절정90~99 / 전설100. 고급모드는 정확한 능력과 승률을 숨깁니다.</p><label>연도 연출<select id="seconds">'+[0,3,6,9].map(n=>'<option value="'+n+'" '+(pref.seconds===n?'selected':'')+'>'+n+'초</option>').join('')+'</select></label><label><input id="motion" type="checkbox" '+(pref.motion?'checked':'')+'>모션 줄이기</label>');}
function activityHelp(){show('선택의 실제 효과','<p>집중 활동은 주력 능력을 크게, 나머지를 조금 성장시킵니다. 대성공·사건·대회 우승은 추가 성장합니다.</p><p><b>학식 탐구</b>: 학식 논전과 책 집필. <b>논변 수련</b>: 반박 대결. <b>설득 연습</b>: 교화 대결. <b>통솔 수련</b>: 통솔 대결 + 이후 후보의 초절정 확률 상승.</p><p>통솔만 올리면 뛰어난 제자를 만날 가능성은 높아지지만 학식·논변 중심 상대에게 불리해집니다. 기존 제자를 성장시키기 위해 통솔을 반드시 누를 필요는 없습니다.</p><p>개인 논전은 각 상대 학파의 중요 능력 두 개를 먼저 확인하세요. 능력이 높은 쪽이 유리하지만 승리가 확정되지는 않습니다.</p>');}
function countryInfo(id){const s=S.state(g,id);const move=id!==g.host?btn('move','자유 이동 · 무료 영향력 없음','primary wide','data-id="'+id+'" '+(g.awaitingReport||g.ended?'disabled':'')):'';show(s.name+'나라 · 사상 판세','<h3>공식 사상 '+(s.official?chip(s.official):'없음')+'</h3>'+S.rankings(s).map(r=>'<div class="personrank"><b>'+r.rank+'</b>'+chip(r.id)+'<strong>'+pct(r.share)+'</strong></div>').join('')+'<p>후원 '+(s.patronLeft?chip(s.patron)+' 남은 '+s.patronLeft+'년':'없음')+'</p><h3>최근 변화</h3>'+g.history.slice(-5).map(r=>'<p>'+r.year+'년차 '+pct(r.before.country[id])+'→'+pct(r.after.country[id])+'</p>').join('')+move+'<p>후원과 필사본, 현지 제자 지부는 다른 나라로 가도 계속 활동합니다.</p>');}
function tournamentInfo(id){const t=S.upcoming(g).find(t=>t.id===id)||S.tiers.find(t=>t.id===id);if(!t)return;const es=g.events.filter(e=>e.tier===id);show(t.name,'<p>'+esc(t.description)+'</p><div class="notice">'+esc(t.reason||S.qualification(g,id).reason)+'</div><p>우승하면 규모별 명성·영향력·문하생·전 능력 성장. 전국 규모 이상은 다른 나라에도 일부 퍼집니다.</p><h3>지난 대회 성적</h3>'+es.map(e=>'<p>'+e.year+'년차 '+S.placement(e.placement)+' '+btn('event','상세','compact','data-id="'+e.id+'"')+'</p>').join('')+(es.length?'':'<p>아직 참가 기록이 없습니다.</p>'));}
function recordDetail(id){const r=g.records[id];show(({friendly:'일반 논전',individual:'개인대회',team:'단체전·리그'})[id]+' 통산', '<h3>'+recText(r)+' · 내부 '+r.roundWins+'승 '+r.roundLosses+'패</h3>'+(id!=='team'?Object.entries(r.bySchool).map(([s,x])=>'<p>'+chip(s)+' '+x.wins+'승 '+x.losses+'패 · 내부 '+x.roundWins+'승 '+x.roundLosses+'패</p>').join(''):'<p>MVP '+r.mvp+'회 · 개인 단체출전 '+recText(g.records.teamDuels)+'</p>')+'<h3>최근 경기</h3>'+r.matches.slice(-20).reverse().map(m=>btn(id==='team'?'teamMatch':'match',esc(m.context)+' · '+(id==='team'?label(m.winner)+' 승':m.roundWins+':'+m.roundLosses+' '+esc(m.opponentName)),'resultrow','data-id="'+m.id+'"')).join(''));}
function achievements(){const all=new Set([...S.endings(g),...g.milestones]);for(const m of g.records.friendly.matches)if(m.roundWins===7)all.add(label(m.opponentSchool)+' 상대로 7합 전승');return [...all];}
function rememberLife(){if(!g)return;meta.codex=[...new Set([...(meta.codex||[]),...achievements()])];if(g.ended&&!meta.records.some(r=>r.runId===g.runId)){meta.records.push(S.summary(g));meta.records=meta.records.slice(-20);}}
function codex(){const defs=['30년의 질문','천하를 이끈 학파','백가의 세 이름','전설을 넘어선 논객','스승을 넘어선 제자','청출어람의 결승','세 시대의 최강 문하','당대 최강 문하','죽간에 남은 생애','열국을 잇는 지부','27년 무오답','인재를 알아본 큰스승','열 번의 연승',...S.schools.map(s=>s.name+' 상대로 7합 전승'),...['공자','맹자','노자','장자','묵자','한비자','손자','손빈'].map(s=>s+' 격파')],unlocked=new Set([...(meta.codex||[]),...achievements()]);for(const m of g.records.friendly.matches)if(m.roundWins===7)unlocked.add(label(m.opponentSchool)+' 상대로 7합 전승');show('엔딩·업적 도감','<p>누적 달성 '+defs.filter(s=>unlocked.has(s)).length+'/'+defs.length+'종</p><div class="codex">'+defs.map(s=>'<span class="'+(unlocked.has(s)?'gold':'locked')+'">'+(unlocked.has(s)?'✓ ':'◇ ')+esc(s)+'</span>').join('')+'</div>');}
document.addEventListener('click',async e=>{const control=e.target.closest('select,input,option');if(control)return;const t=e.target.closest('[data-card],[data-action],button,a');if(!t)return;if(t.dataset.card){if(!S.toggleSchool(g,t.dataset.card))toast('직접 선택은 최대5개입니다.');persist();decision(true);return;}const a=t.dataset.action,id=t.dataset.id;if(!a)return;if(busy&&a!=='skip'&&a!=='close')return;
 if(a==='close'){close();return;}if(a==='skip'){finishAnimation();return;}if(a==='replay'){replay(id);return;}if(a==='replaySkip'){finishReplay();return;}if(a==='title'){view='title';base();return;}if(a==='setup'){view='setup';base();return;}if(a==='resume'){view='home';base();return;}if(a==='legacy'){window.open?.('v12/index.html','_blank');return;}if(a==='start'){rememberLife();g=S.create({...setup,balance:settings,customRules:JSON.stringify(settings)!==JSON.stringify(C.defaults)});view='home';selected='balanced';persist();base();return;}

 if(a==='admit'){S.resolve(g,'accept',{id});persist();close();base();return;}if(a==='declineCandidates'){S.resolve(g,'decline');persist();close();base();return;}if(a==='break'){S.resolve(g,'break');persist();base();breakAnimation(g.lastBreakthrough);return;}if(a==='breakDone'){close();if(g.pending)pending();else base();return;}
 if(a==='scoutMove'){S.resolve(g,'move',{country:id});persist();close();base();return;}if(a==='scoutDecline'){S.resolve(g,'decline');persist();close();base();return;}if(a==='teamManual'){teamFinal(true);return;}if(a==='teamRecommend'){const f=g.pending.event.final;lineup=S.recommendLineup(g,f.away,f.requirements);teamFinal(true);return;}if(a==='teamAuto'||a==='teamCompete'){try{S.resolve(g,a==='teamAuto'?'auto':'compete',{lineup});lineup=[];persist();close();base();}catch(err){toast(err.message);}return;}
